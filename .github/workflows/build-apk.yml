name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests (engine core) and release build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :core:test assembleRelease --no-daemon --stacktrace --warning-mode=none 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -nE "error:|e: |What went wrong|FAILURE|Execution failed|Caused by|cannot find symbol|AAPT|FAILED|Test.*>" build.log | head -80 > errors.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/ci-logs && cp build.log errors.txt /tmp/ci-logs/ 2>/dev/null || true
          cp -r core/build/reports/tests /tmp/ci-logs/test-report 2>/dev/null || true
          git fetch -q origin ci-logs || true
          git switch -q --orphan ci-logs-tmp
          git rm -rq --cached . >/dev/null 2>&1 || true
          if git rev-parse -q --verify origin/ci-logs >/dev/null; then git reset -q --soft origin/ci-logs; fi
          mkdir -p "logs/run-${GITHUB_RUN_NUMBER}"
          cp -r /tmp/ci-logs/* "logs/run-${GITHUB_RUN_NUMBER}/"
          git add -f "logs/run-${GITHUB_RUN_NUMBER}"
          git commit -q -m "CI log for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push -q origin HEAD:refs/heads/ci-logs

      - name: Collect APK
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          mkdir -p release
          NAME="NStorm2Mobile-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release/${NAME}"
          (cd release && sha256sum "${NAME}" > "${NAME}.sha256")
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "release/${NAME}"
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "release/${NAME}" | grep -E "^package|^sdkVersion|^targetSdkVersion|^application-label|^launchable-activity|^native-code" || true
          ls -la release
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: release/*
          retention-days: 30

      # Every successful build of main publishes/updates the release v<versionName>.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NStorm 2 Mobile v${{ steps.apk.outputs.version }} (native)
          files: release/*
          body_path: RELEASE_NOTES.md
          make_latest: true
          fail_on_unmatched_files: true
