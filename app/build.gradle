buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
    }

}

plugins {
    id 'com.android.application'
}



tasks.register("prepareKotlinBuildScriptModel"){}

android {
    namespace 'com.winlator.cmod'

    compileSdk 34

    defaultConfig {
        // NStorm 2 Mobile. The id is deliberately 17 characters long, the same
        // length as upstream's "com.winlator.cmod": the prebuilt rootfs contains
        // that absolute data path inside ELF binaries, and tools/prepare_assets.py
        // rewrites it byte-for-byte without shifting any offsets.
        applicationId "com.nstorm2mobile"
        minSdkVersion 26

        // Must stay at 28: Android 10+ (target 29+) forbids executing binaries
        // extracted to the app data dir, which Wine/Box64 rely on.
        targetSdkVersion 28

        versionCode 1
        versionName "1.0.0"
        resValue "string", "nstorm_build_info", "NStorm 2 Mobile 1.0.0 (Winlator Cmod v13.1 base)"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }


        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Public community signing key committed to the repo so every CI build
        // can be installed over the previous one. See README "Keamanan".
        nstorm2 {
            storeFile file('nstorm2-release.jks')
            storePassword 'nstorm2mobile'
            keyAlias 'nstorm2'
            keyPassword 'nstorm2mobile'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.nstorm2
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.nstorm2
        }
    }

    // The bundled archives are already xz/zstd compressed; deflating them again
    // only slows down first-run extraction on the device.
    androidResources {
        noCompress += ['txz', 'tzst', 'wcp', 'xz', 'mp3', 'sf2']
    }


    ndkVersion '27.0.12077973'
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }


    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Winlator’s dependencies
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.activity:activity-ktx:1.4.0'
    implementation 'androidx.fragment:fragment-ktx:1.4.0'
    implementation files('libs/MidiSynth/MidiSynth.jar')
    implementation 'androidx.recyclerview:recyclerview:1.2.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.google.code.gson:gson:2.8.8'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.68'
    implementation 'org.openjsse:openjsse:1.1.7'
    implementation 'androidx.core:core:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-common:2.6.0'
    implementation 'com.kohlschutter.junixsocket:junixsocket-native-common:2.6.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'com.google.android.material:material:1.6.1'
}



