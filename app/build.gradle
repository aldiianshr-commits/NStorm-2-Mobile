plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nstorm2.mobile'
    compileSdk 34

    defaultConfig {
        // Same id and signing key as v1, so this build installs over it.
        applicationId "com.nstorm2mobile"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0.0-alpha.1"
    }

    signingConfigs {
        // Public community key committed to the repo (see README "Keamanan").
        nstorm2 {
            storeFile file('nstorm2-release.jks')
            storePassword 'nstorm2mobile'
            keyAlias 'nstorm2'
            keyPassword 'nstorm2mobile'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.nstorm2
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.nstorm2
        }
    }

    lint {
        // Sideloaded APK; target 34 keeps the classic (non edge-to-edge) window layout.
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}
